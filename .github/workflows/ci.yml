name: CI

# Build + test @fcr/ui on every PR and on push to main. The fcr-* apps consume it as a prebuilt
# tarball (committed dist/), so this is where the shared grid + report builder get their coverage
# and where a stale committed dist is caught.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Clean first so the guard below also catches a deleted-source orphan (tsc emits, never prunes).
      - name: Typecheck + emit dist (from clean)
        run: npm run clean && npm run build
      # Consumers run the COMMITTED dist/*; the tests import src/*. A stale/hand-edited/missing/orphaned
      # dist ships behavior the suite never exercised. git status --porcelain (not git diff) reports
      # untracked files too, so a new module's uncommitted dist and a deleted module's orphan both fail.
      - name: dist is in sync with src (no stale/missing/orphaned committed dist)
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::committed dist/ is out of sync — run 'npm run clean && npm run build' and commit dist/"
            git status --porcelain -- dist
            exit 1
          fi
      - name: Unit tests
        run: npm test
